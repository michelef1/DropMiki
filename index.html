<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShare PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #007bff; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; }
        .drop-zone {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 40px 20px;
            margin: 20px 0;
            cursor: pointer;
            background: #f0f7ff;
            transition: background 0.3s;
        }
        .drop-zone:hover { background: #e1f0ff; }
        input[type="file"] { display: none; }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #0056b3; }
        .status { margin-top: 15px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MiniShare</h1>
        <p>Invia file velocemente (Struttura Base PWA)</p>
        
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            Trascina qui il file o clicca per selezionarlo
            <input type="file" id="fileInput">
        </div>
        
        <button class="btn" onclick="alert('In una PWA completa, qui verrebbe inizializzato il canale WebRTC per inviare il file!')">Cerca Dispositivi</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        // Registrazione del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrato con successo!', reg))
                    .catch(err => console.log('Errore registrazione Service Worker:', err));
            });
        }

        // Gestione file di esempio
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                document.getElementById('status').innerText = `File pronto: ${e.target.files[0].name}`;
            }
        });
    </script>
</body>
</html>
